name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare env files
        run: |
          cat > .env <<EOF
          NGINX_PORT=81
          EOF

          cat > .env.local <<EOF
          APP_ENV=dev
          APP_SECRET=test
          DATABASE_URL="postgresql://pguser:pguser@postgres:5432/study_on"
          BILLING_API_URL="http://billing.study-on.local"
          DEFAULT_URI="http://study-on.local"
          EOF

          cat > .env.test.local <<EOF
          APP_ENV=test
          APP_SECRET=test
          DATABASE_URL="postgresql://pguser:pguser@postgres:5432/study_on"
          BILLING_API_URL="http://billing.study-on.local"
          DEFAULT_URI="http://study-on.local"
          EOF

      - name: Prepare docker volumes and network
        run: |
          mkdir -p ~/.composer
          mkdir -p ~/.yarn
          docker network create study-onbilling_default || true

      - name: Build containers
        run: |
          docker compose build
          docker compose up -d
          docker compose ps

      - name: Install PHP dependencies
        run: |
          docker compose exec -T -u root php composer install --no-interaction --prefer-dist --no-scripts

      - name: Install frontend dependencies
        run: |
          docker compose exec -T -u root node npm install

      - name: Build frontend
        run: |
          docker compose exec -T -u root node npm run dev

      - name: Prepare test database
        run: |
          docker compose exec -T -u root postgres psql -U pguser -c "DROP DATABASE IF EXISTS study_on_test;"
          docker compose exec -T -u root postgres psql -U pguser -c "CREATE DATABASE study_on_test;"
          docker compose exec -T -u root php bin/console doctrine:migrations:migrate --env=test -n
          docker compose exec -T -u root php bin/console doctrine:fixtures:load --env=test -n

      - name: Run PHPUnit
        run: |
          docker compose exec -T -u root php bin/phpunit
